project:
  name: medical_fraud_detection
  root_dir: ".."

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  models_dir: "models"
  checkpoints_dir: "models/checkpoints"
  logs_dir: "logs"

data_sources:
  claim: "data/raw/claim.csv"
  claim_patient: "data/raw/claim_associated_with_patient.csv"
  claim_prescriber: "data/raw/claim_submitted_by_prescriber.csv"
  specialty_subspecialty: "data/raw/specialties_subspecialties.csv"
  prescriber_subspecialty: "data/raw/subspecialties_prescriber.csv"

neo4j:
  uri: "bolt://localhost:7687"
  user: "neo4j"
  password: "neo4jLocal123!"
  database: "neo4j"
  batch_size: 500
  gds_graph_name: "medicalFraudGraph"

features:
  claim_frequency_window_days: 90
  repeated_claim_window_days: 30
  specialty_support_threshold: 0.05
  high_claim_quantile: 0.97
  doctor_daily_claim_quantile: 0.98
  community_risk_quantile: 0.85
  provider_anomaly_z_threshold: 1.5
  weak_label_min_score: 2.0
  amount_proxy_base: 100.0

model:
  target_column: "fraud_label"
  weak_label_column: "weak_fraud_label"
  allow_weak_labels: true
  test_size: 0.2
  random_state: 42
  batch_size: 64
  learning_rate: 0.05
  num_estimators: 300
  checkpoint_interval: 10
  max_depth: 8
  early_stopping_rounds: 30
  eval_metric: "auc"
  device_type: "cpu"
  enable_gpu: false
  primary_model: "lightgbm"
  fallback_model: "gradient_boosting"
  allow_fallback_model: true
  rf_n_estimators: 300
  rf_max_depth: 8
  use_ensemble: true
  threshold_recall_target: 0.80

dashboard:
  default_top_n: 20
